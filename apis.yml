aid: knl
name: KNL
description: 'KNL (KNL Networks Oy) is a Finnish defence-technology company founded in 2011 and headquartered
  in Oulu, Finland, that builds long-range, GNSS-independent HF radio communication systems for military,
  naval, and critical-communications operators. Its Cognitive Networked HF (CNHF) platform is a family of
  software-defined radios — CNHF Manpack, CNHF1 Radio, CNHF Vehicular, and CNHF Evolve — that perform
  continuous spectrum estimation and automatically switch to the next best channel to sustain IP data links
  over thousands of kilometres in jammed, contested, or infrastructure-denied environments. Radios are
  operated through a web-based CNHF User Interface providing role-based access, webmail, XMPP-interoperable
  instant messaging, mapping, and spectrum analysis. KNL was acquired by Telenor Maritime at the end of 2020
  and now operates as Telenor''s dedicated defence and security connectivity business. The company holds ISO
  9001, AQAP 2110 (NATO), and ISO/IEC 27001 certifications and publishes no public developer API surface.'
